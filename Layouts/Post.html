<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {{ page.title }} | Chloe Marie Connolly
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

</head>

<body>

  <aside class="sidebar">

    <a class="nav-box"
       href="{{ '/' | relative_url }}">
       Home
    </a>

    <a class="nav-box"
       href="{{ '/projects.html' | relative_url }}">
       Projects
    </a>

    <a class="nav-box"
       href="{{ '/blog.html' | relative_url }}">
       Blog
    </a>

    <a class="nav-box"
       href="{{ '/stargazers.html' | relative_url }}">
       Stargazers
    </a>

  </aside>


  <main class="content">


    <article class="blog-post">

      <h1>
        {{ page.title }}
      </h1>

      <p class="blog-date">
        {{ page.date | date: "%d %B %Y" }}
      </p>


      {% if page.categories %}

      <div class="blog-tags">

        {% for category in page.categories %}

        <span class="blog-tag">
          {{ category }}
        </span>

        {% endfor %}

      </div>

      {% endif %}


      <div class="post-content">

        {{ content }}

      </div>

    </article>

  </main>

</body>

</html>
